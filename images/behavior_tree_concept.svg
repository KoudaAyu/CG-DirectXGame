<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background: #12131a; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- Definitions for gradients and markers -->
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="100%" stop-color="#ffcc33" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0df3a3" />
      <stop offset="100%" stop-color="#02aab0" />
    </linearGradient>
    <linearGradient id="condGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apply Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- TITLE -->
  <text x="50" y="50" fill="#ffffff" font-size="24" font-weight="bold" letter-spacing="1">ボスAI 意思決定プロセス (Behavior Tree 挙動イメージ)</text>
  <text x="50" y="80" fill="#888e9b" font-size="14">木構造の上部・左側から優先的に探索され、最終的な行動を決定します</text>

  <!-- ==================== NODES ==================== -->

  <!-- Root: Selector (Orange) -->
  <g transform="translate(410, 100)">
    <rect width="180" height="70" rx="35" fill="#1c1e29" stroke="url(#rootGrad)" stroke-width="2.5" filter="url(#glow)" />
    <text x="90" y="32" fill="#ffcc33" font-size="13" font-weight="bold" text-anchor="middle">優先選択ノード</text>
    <text x="90" y="52" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Root: Selector</text>
  </g>

  <!-- Level 2: Sequence 1 (Player Close) -->
  <g transform="translate(170, 240)">
    <rect width="180" height="70" rx="8" fill="#1c1e29" stroke="url(#nodeGrad)" stroke-width="2" />
    <text x="90" y="28" fill="#4facfe" font-size="12" font-weight="bold" text-anchor="middle">シーケンス(順次実行)</text>
    <text x="90" y="48" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">攻撃シーケンス</text>
  </g>

  <!-- Level 2: Sequence 2 (Player Far) -->
  <g transform="translate(410, 240)">
    <rect width="180" height="70" rx="8" fill="#1c1e29" stroke="url(#nodeGrad)" stroke-width="2" />
    <text x="90" y="28" fill="#4facfe" font-size="12" font-weight="bold" text-anchor="middle">シーケンス(順次実行)</text>
    <text x="90" y="48" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">追跡シーケンス</text>
  </g>

  <!-- Level 2: Action (Idle/Patrol) -->
  <g transform="translate(650, 240)">
    <rect width="180" height="70" rx="8" fill="#1c1e29" stroke="url(#actionGrad)" stroke-width="2" />
    <text x="90" y="28" fill="#0df3a3" font-size="12" font-weight="bold" text-anchor="middle">アクション(末端行動)</text>
    <text x="90" y="48" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">待機・索敵巡回</text>
  </g>

  <!-- Level 3 (Under Sequence 1): Condition (Close?) -->
  <g transform="translate(80, 380)">
    <polygon points="90,10 180,45 90,80 0,45" fill="#1c1e29" stroke="url(#condGrad)" stroke-width="2" />
    <text x="90" y="42" fill="#ff7eb3" font-size="11" font-weight="bold" text-anchor="middle">条件判定</text>
    <text x="90" y="58" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">プレイヤーが近くにいる？</text>
  </g>

  <!-- Level 3 (Under Sequence 1): Action (Attack) -->
  <g transform="translate(260, 390)">
    <rect width="150" height="60" rx="8" fill="#1c1e29" stroke="url(#actionGrad)" stroke-width="1.5" />
    <text x="75" y="36" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">ボス攻撃を実行</text>
  </g>

  <!-- Level 3 (Under Sequence 2): Condition (Visible?) -->
  <g transform="translate(425, 380)">
    <polygon points="75,10 150,45 75,80 0,45" fill="#1c1e29" stroke="url(#condGrad)" stroke-width="2" />
    <text x="75" y="42" fill="#ff7eb3" font-size="11" font-weight="bold" text-anchor="middle">条件判定</text>
    <text x="75" y="58" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">プレイヤーが視界にいる？</text>
  </g>

  <!-- Level 3 (Under Sequence 2): Action (Move) -->
  <g transform="translate(590, 390)">
    <rect width="150" height="60" rx="8" fill="#1c1e29" stroke="url(#actionGrad)" stroke-width="1.5" />
    <text x="75" y="36" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">プレイヤーへ接近</text>
  </g>


  <!-- ==================== LINES / CONNECTIONS ==================== -->

  <!-- Root to Level 2 (Paths with glowing effect or standard stroke) -->
  <!-- Left path -->
  <path d="M 500 170 C 500 210 260 210 260 240" fill="none" stroke="#2a2d3d" stroke-width="3" />
  <path d="M 500 170 C 500 210 260 210 260 240" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.8" />
  <text x="340" y="200" fill="#4facfe" font-size="11" font-weight="bold">【優先度1】</text>

  <!-- Middle path -->
  <path d="M 500 170 C 500 210 500 210 500 240" fill="none" stroke="#2a2d3d" stroke-width="3" />
  <path d="M 500 170 C 500 210 500 210 500 240" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.8" />
  <text x="510" y="210" fill="#888e9b" font-size="11">【優先度2】</text>

  <!-- Right path -->
  <path d="M 500 170 C 500 210 740 210 740 240" fill="none" stroke="#2a2d3d" stroke-width="3" />
  <path d="M 500 170 C 500 210 740 210 740 240" fill="none" stroke="#888e9b" stroke-width="1.5" opacity="0.5" />
  <text x="640" y="200" fill="#888e9b" font-size="11">【優先度3】</text>


  <!-- Sequence 1 to Children -->
  <path d="M 260 310 C 260 350 170 350 170 380" fill="none" stroke="#2a2d3d" stroke-width="2" />
  <path d="M 260 310 C 260 350 335 350 335 390" fill="none" stroke="#2a2d3d" stroke-width="2" />
  
  <text x="190" y="350" fill="#ff7eb3" font-size="10">1.成否確認</text>
  <text x="300" y="350" fill="#0df3a3" font-size="10">2.実行</text>

  <!-- Sequence 2 to Children -->
  <path d="M 500 310 C 500 350 500 350 500 380" fill="none" stroke="#2a2d3d" stroke-width="2" />
  <path d="M 500 310 C 500 350 665 350 665 390" fill="none" stroke="#2a2d3d" stroke-width="2" />

  <text x="450" y="350" fill="#ff7eb3" font-size="10">1.成否確認</text>
  <text x="600" y="350" fill="#0df3a3" font-size="10">2.実行</text>

</svg>
