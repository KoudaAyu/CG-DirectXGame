<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 900px;
    height: 420px;
    background-color: #14171c;
    color: #ffffff;
    font-family: "Meiryo", "MS Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .canvas-box {
    position: relative;
    width: 880px;
    height: 400px;
    border: 2px solid #00bb66;
    background-color: #14171c;
    border-radius: 4px;
    padding: 15px;
  }

  .title-tag {
    position: absolute;
    top: 12px;
    left: 15px;
    font-size: 17px;
    font-weight: bold;
    color: #00dd88;
  }

  /* 障害物（木のフェンス・厚み40cm） */
  .obstacle-box {
    position: absolute;
    left: 440px;
    top: 55px;
    width: 40px;
    height: 250px;
    transform: translateX(-50%);
    border: 2px solid #c97a3e;
    background-color: #2b1f16;
    z-index: 2;
  }
  .obstacle-label {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 14px;
    color: #e09f67;
  }
  .obstacle-thick {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 12px;
    color: #a8764e;
  }

  /* スイープ線分（緑色の実線） */
  .sweep-line {
    position: absolute;
    left: 144px;
    width: 276px; /* 壁の左面 440-20=420px -> 420-144=276px */
    top: 163px;
    height: 4px;
    background-color: #00dd88;
    z-index: 3;
  }
  .sweep-text {
    position: absolute;
    top: -24px;
    left: 45%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 13px;
    color: #00ffaa;
  }

  /* 仮想延長線 */
  .virtual-line {
    position: absolute;
    left: 420px;
    width: 314px;
    top: 163px;
    height: 2px;
    border-top: 2px dotted #556677;
  }

  /* 弾丸 Frame 1 (始点) */
  .bullet-f1 {
    position: absolute;
    left: 130px;
    top: 150px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background-color: #00b4d8;
    border: 2px solid #ffffff;
    z-index: 5;
  }
  .label-f1 {
    position: absolute;
    left: 144px;
    top: 188px;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 14px;
    color: #00b4d8;
    text-align: center;
    line-height: 1.3;
  }

  /* 仮想終点 Frame 2 */
  .bullet-f2-virtual {
    position: absolute;
    left: 720px;
    top: 150px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px dashed #667788;
    z-index: 5;
  }
  .label-f2 {
    position: absolute;
    left: 734px;
    top: 188px;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 13px;
    color: #778899;
    text-align: center;
    line-height: 1.3;
  }

  /* 衝突点（ヒットマーカー） */
  .hit-marker {
    position: absolute;
    left: 420px;
    top: 164px;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    background-color: #ffea00;
    border: 2px solid #ffffff;
    border-radius: 50%;
    z-index: 10;
    box-shadow: 0 0 10px #ffea00;
  }
  .hit-tag {
    position: absolute;
    left: 310px;
    top: 100px;
    transform: translateX(-50%);
    white-space: nowrap;
    background-color: #2b2810;
    border: 1px solid #ffd700;
    color: #ffe600;
    padding: 5px 12px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    z-index: 10;
  }

  /* 緑色の吹き出しバッジ */
  .alert-badge {
    position: absolute;
    bottom: 18px;
    left: 440px;
    transform: translateX(-50%);
    background-color: #1b633b;
    border: 1px solid #33cc77;
    border-radius: 6px;
    padding: 8px 24px;
    text-align: center;
    white-space: nowrap;
  }
  .alert-title {
    font-size: 15px;
    font-weight: bold;
    color: #ffffff;
  }
  .alert-desc {
    font-size: 13px;
    color: #ccffdd;
    margin-top: 2px;
  }
</style>
</head>
<body>

  <div class="canvas-box">
    <div class="title-tag">◆ CCD（連続衝突判定）：線分スイープによる完全交差判定</div>

    <!-- 障害物 -->
    <div class="obstacle-box">
      <div class="obstacle-label">木のフェンス</div>
      <div class="obstacle-thick">厚み: 40cm</div>
    </div>

    <!-- スイープ線分 -->
    <div class="sweep-line">
      <div class="sweep-text">移動線分 P(t) = P_prev + t * v</div>
    </div>

    <!-- 仮想延長線 -->
    <div class="virtual-line"></div>

    <!-- 着弾点 -->
    <div class="hit-marker"></div>
    <div class="hit-tag">
      ★ 表面交点 P_hit<br>
      (媒介変数 t_min を算出)
    </div>

    <!-- 弾丸 Frame 1 -->
    <div class="bullet-f1"></div>
    <div class="label-f1">
      <b>始点 P_prev</b><br>
      (Frame 1)
    </div>

    <!-- 仮想終点 Frame 2 -->
    <div class="bullet-f2-virtual"></div>
    <div class="label-f2">
      終点 P_curr<br>
      (仮想到達点)
    </div>

    <!-- 緑の吹き出し -->
    <div class="alert-badge">
      <div class="alert-title">【表面で100%確実にキャッチ！】</div>
      <div class="alert-desc">線分と板の交差方程式を解き、表面で即座に弾丸破棄＆木片スパーク発生</div>
    </div>

  </div>

</body>
</html>
