<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 450px;
    background-color: #333333;
    font-family: "Meiryo", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    border-top: 4px solid #3b82f6;
  }

  .card-container {
    display: flex;
    align-items: center;
    position: relative;
    width: 100%;
    justify-content: center;
  }

  /* カード同士を結ぶ水平ライン */
  .connecting-line {
    position: absolute;
    top: 50%;
    left: 80px;
    right: 80px;
    height: 3px;
    background-color: #666666;
    z-index: 1;
    transform: translateY(-50%);
  }

  /* クリーム色カード */
  .card {
    position: relative;
    z-index: 2;
    width: 340px;
    background-color: #fff9db;
    border: 2px solid #222222;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    margin: 0 25px;
    overflow: hidden;
  }

  .card-header {
    padding: 12px 16px;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    color: #111111;
    border-bottom: 2px solid #222222;
  }

  .card-body {
    padding: 18px 24px;
    color: #222222;
    font-size: 16px;
    line-height: 1.8;
  }

  .card-body ul {
    list-style: none;
  }

  .card-body li {
    position: relative;
    padding-left: 18px;
    margin-bottom: 8px;
  }
  .card-body li:last-child {
    margin-bottom: 0;
  }

  .card-body li::before {
    content: "-";
    position: absolute;
    left: 0;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="card-container">
    <div class="connecting-line"></div>

    <!-- カード 1 -->
    <div class="card">
      <div class="card-header">Bullet.cpp (線分の生成)</div>
      <div class="card-body">
        <ul>
          <li>前フレーム座標 P_prev を保持</li>
          <li>現在座標 P_curr と結ぶ線分</li>
          <li>弾丸を「線」として捉える</li>
        </ul>
      </div>
    </div>

    <!-- カード 2 -->
    <div class="card">
      <div class="card-header">CollisionManager (CCD判定)</div>
      <div class="card-body">
        <ul>
          <li>線分 vs OBB のスラブ交差判定</li>
          <li>最小媒介変数 t_min を算出</li>
          <li>壁表面の交点 P_hit を特定</li>
        </ul>
      </div>
    </div>

    <!-- カード 3 -->
    <div class="card">
      <div class="card-header">ゲーム側（完全解決）</div>
      <div class="card-body">
        <ul>
          <li>すり抜け率 0% を達成</li>
          <li>表面で弾丸を即座に破棄</li>
          <li>めり込まず火花エフェクト発生</li>
        </ul>
      </div>
    </div>

  </div>

</body>
</html>
