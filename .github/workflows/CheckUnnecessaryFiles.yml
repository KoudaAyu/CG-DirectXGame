# リポジトリ内の不要なファイルを見つけるためのGitHub Actions
name: Check Unnecessary Files # スペルミスを修正 (ChechUnnecessaryFiles -> Check Unnecessary Files)

on:
  # GitHub Actionsタブから手動で実行できるようにする
  workflow_dispatch:
  # masterブランチへのプッシュでも実行する
  push:
    branches:
      - master
      - GE3_Object

# 検出する不要なファイルのパターンを定義する環境変数
# パターンはスペース区切りで指定する
env:
  # 指定ファイル名(拡張子など)のパターン
  UNWANTED_FILE_PATTERNS: "*.pdb *.ilk *.user *.ncb *.suo *.log *.dmp *.zip imgui.ini desctop.ini dxcompiler.dll dxil.dll"

  # ディレクトリ名のパターン(ビルド出力フォルダなど)
  UNWANTED_DIR_PATTERNS: "generated x64 win32 arm64 .vs bin ipch logs Dump"

jobs:
  check-files:
    name: 不要なファイルを検索
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 不要なファイルとディレクトリを検索(bash)
        run: |
          # ディレクトリ条件を構築(最初の不要な -o を後で削除)
          DIR_CONDITIONS=()
          for pattern in $UNWANTED_DIR_PATTERNS; do
            DIR_CONDITIONS+=(-o -iname "$pattern")
          done
          unset DIR_CONDITIONS[0]

          # ファイル条件を構築(最初の不要な -o を後で削除)
          NAME_CONDITIONS=()
          for pattern in $UNWANTED_FILE_PATTERNS; do
            NAME_CONDITIONS+=(-o -iname "$pattern")
          done
          unset NAME_CONDITIONS[0]

          # 1回の find 実行で全件を検索
          UNWANTED_LIST=$(find . -path "./.git" -prune -o \
           \( \( "${DIR_CONDITIONS[@]}" \) -a -type d -print -prune \) -o \
            \( \( "${NAME_CONDITIONS[@]}" \) -a -type f -print \) )

          # 検出結果があればエラーとして出力させ、失敗させる
          if [ -n "$UNWANTED_LIST" ]; then
            echo "::error::不要なファイル/ディレクトリが見つかりました:"
            echo "$UNWANTED_LIST"
            exit 1
          fi

          # エラーがなかった場合の成功メッセージ
          echo "リポジトリはクリーンです"